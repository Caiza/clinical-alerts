spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clinical
    username: clinical
    password: clinical
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000          # 30 seconds
      idle-timeout: 600000               # 10 minutes
      max-lifetime: 1800000              # 30 minutes
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry-group-v3
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        session.timeout.ms: 45000          # default 10000 → increase
        heartbeat.interval.ms: 15000       # default 3000 → ~1/3 of session timeout
        request.timeout.ms: 60000
        max.poll.interval.ms: 300000       # 5 minutes — important if processing is slow
        max.poll.records: 100              # reduce if processing is heavy
    
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
   
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    threads:
      max: 400          # default is 200, try 400
      min-spare: 50
    connection-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true